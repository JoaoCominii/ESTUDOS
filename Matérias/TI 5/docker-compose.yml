# ==============================================================================
# Ambiente de Monitoramento - Zabbix Server + PostgreSQL + Web Frontend
# Projeto TI 5 - Sprint 2
# ==============================================================================

services:
  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix_password}
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zabbix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    ports:
      - "10051:10051"
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix_password}
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      ZBX_STARTTRAPPERS: 5
    depends_on:
      zabbix-db:
        condition: service_healthy
    networks:
      - zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix_password}
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      PHP_TZ: "America/Sao_Paulo"
    depends_on:
      - zabbix-server
    networks:
      - zabbix-net

volumes:
  zabbix-db-data:
    driver: local

networks:
  zabbix-net:
    driver: bridge
