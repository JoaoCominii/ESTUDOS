spring:
  application:
    name: rotaclara-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/rotaclara
    username: rotaclara
    password: rotaclara
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # o schema é controlado pelo Flyway, não pelo Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

rotaclara:
  jwt:
    # Em produção, sobrescrever via variável de ambiente ROTACLARA_JWT_SECRET.
    secret: "troque-esta-chave-antes-de-ir-para-producao-0123456789"
    expiracao-minutos: 480 # 8h — mesma duração da jornada padrão (RN04)
  cors:
    origem-permitida: "http://localhost:5173"

logging:
  level:
    com.rotaclara: DEBUG
